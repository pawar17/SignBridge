<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignBridge - ASL Recognition (Enhanced)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1400px;
            width: 100%;;
            padding: 40px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .mode-toggle {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            justify-content: center;
        }

        .mode-btn {
            padding: 15px 30px;
            font-size: 1.1em;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .mode-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .mode-btn.active {
            background: #667eea;
            color: white;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .video-section, .result-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
        }

        .section-title {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .video-container {
            position: relative;
        }

        #webcam {
            width: 100%;
            border-radius: 10px;
            background: #000;
            min-height: 300px;
        }

        #canvas {
            display: none;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .prediction-result {
            text-align: center;
            padding: 30px;
        }

        .predicted-sign {
            font-size: 6em;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .confidence {
            font-size: 1.5em;
            color: #666;
            margin: 10px 0;
        }

        .confidence-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .top-predictions {
            margin-top: 30px;
            text-align: left;
        }

        .top-pred-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            margin: 5px 0;
            background: white;
            border-radius: 8px;
        }

        .sentence-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
        }

        .sentence-display {
            background: white;
            padding: 20px;
            border-radius: 10px;
            min-height: 80px;
            margin: 15px 0;
        }

        .sentence-text {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            text-align: center;
            letter-spacing: 3px;
            min-height: 40px;
        }

        .sentence-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }

        .status {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-weight: 500;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .alphabet-reference {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        .alphabet-letter {
            background: #667eea;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2em;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2em;
            }

            .predicted-sign {
                font-size: 4em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤟 SignBridge</h1>
            <p class="subtitle">Real-time ASL Finger Spelling Recognition</p>
        </header>

        <!-- Mode Toggle -->
        <div class="mode-toggle">
            <a href="index_enhanced.html" class="mode-btn active">
                🎯 Prediction Mode
            </a>
            <a href="learning.html" class="mode-btn">
                📚 Learning Mode
            </a>
        </div>

        <div class="status info" id="status">
            Initializing... Please wait
        </div>

        <div class="main-content">
            <div class="video-section">
                <h2 class="section-title">📹 Webcam</h2>
                <div class="video-container">
                    <video id="webcam" autoplay playsinline></video>
                </div>
                <canvas id="canvas"></canvas>
                <div class="controls">
                    <button class="btn-primary" id="startBtn" onclick="startWebcam()">Start Camera</button>
                    <button class="btn-secondary" id="captureBtn" onclick="captureAndPredict()" disabled>Predict Sign</button>
                    <button class="btn-secondary" id="autoBtn" onclick="toggleAuto()" disabled>Auto Mode: OFF</button>
                    <button class="btn-success" id="sentenceBtn" onclick="toggleSentenceMode()" disabled>Sentence Mode: OFF</button>
                </div>
            </div>

            <div class="result-section">
                <h2 class="section-title">🎯 Prediction</h2>
                <div class="prediction-result">
                    <div class="predicted-sign" id="predictedSign">-</div>
                    <div class="confidence" id="confidenceText">Confidence: -</div>
                    <div class="confidence-bar">
                        <div class="confidence-fill" id="confidenceFill" style="width: 0%">0%</div>
                    </div>
                    <div class="top-predictions" id="topPredictions"></div>
                </div>
            </div>
        </div>

        <!-- Sentence Translation Section -->
        <div class="sentence-section" id="sentenceSection" style="display: none;">
            <h2 class="section-title">💬 Sentence Builder</h2>
            <div class="sentence-display">
                <div class="sentence-text" id="sentenceText"></div>
            </div>
            <div class="sentence-controls">
                <button class="btn-secondary" onclick="clearSentence()">Clear Sentence</button>
                <button class="btn-success" onclick="speakSentence()">🔊 Speak</button>
            </div>
        </div>

        <div class="video-section">
            <h2 class="section-title">🔤 Supported Signs</h2>
            <div class="alphabet-reference" id="alphabetRef"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        let stream = null;
        let autoMode = false;
        let sentenceMode = false;
        let autoInterval = null;
        let sessionId = 'user_' + Date.now();

        // Initialize
        async function init() {
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();

                if (data.model_loaded) {
                    updateStatus('API connected! Model ready. Click "Start Camera" to begin.', 'success');
                    document.getElementById('startBtn').disabled = false;
                    loadAlphabet();
                } else {
                    updateStatus('API connected but model not loaded. Please train the model first.', 'error');
                }
            } catch (error) {
                updateStatus('Cannot connect to API. Make sure backend is running on port 8000.', 'error');
            }
        }

        async function loadAlphabet() {
            try {
                const response = await fetch(`${API_URL}/classes`);
                const data = await response.json();

                const alphabetDiv = document.getElementById('alphabetRef');
                data.classes.forEach(letter => {
                    const div = document.createElement('div');
                    div.className = 'alphabet-letter';
                    div.textContent = letter;
                    alphabetDiv.appendChild(div);
                });
            } catch (error) {
                console.error('Error loading alphabet:', error);
            }
        }

        async function startWebcam() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480 }
                });

                const video = document.getElementById('webcam');
                video.srcObject = stream;

                document.getElementById('startBtn').disabled = true;
                document.getElementById('captureBtn').disabled = false;
                document.getElementById('autoBtn').disabled = false;
                document.getElementById('sentenceBtn').disabled = false;

                updateStatus('Camera started! Show an ASL sign and click "Predict Sign"', 'success');
            } catch (error) {
                updateStatus('Error accessing camera: ' + error.message, 'error');
            }
        }

        async function captureAndPredict() {
            const video = document.getElementById('webcam');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            ctx.drawImage(video, 0, 0);

            canvas.toBlob(async (blob) => {
                await predictSign(blob);
            }, 'image/jpeg');
        }

        async function predictSign(imageBlob) {
            updateStatus('Predicting...', 'info');

            try {
                const formData = new FormData();
                formData.append('file', imageBlob, 'capture.jpg');

                // Use sentence endpoint if sentence mode is on
                const endpoint = sentenceMode ?
                    `${API_URL}/predict_sentence?session_id=${sessionId}` :
                    `${API_URL}/predict`;

                const response = await fetch(endpoint, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    displayPrediction(data);

                    if (sentenceMode && data.sentence) {
                        document.getElementById('sentenceText').textContent = data.sentence;
                    }

                    updateStatus('Prediction complete!', 'success');
                } else {
                    const error = await response.json();
                    updateStatus('Prediction error: ' + error.detail, 'error');
                }
            } catch (error) {
                updateStatus('Error: ' + error.message, 'error');
            }
        }

        function displayPrediction(data) {
            // Handle both regular prediction and sentence prediction responses
            const prediction = data.letter || data.prediction;
            const confidence = data.confidence;
            const top3 = data.top_3;

            document.getElementById('predictedSign').textContent = prediction;

            const confidencePercent = (confidence * 100).toFixed(1);
            document.getElementById('confidenceText').textContent = `Confidence: ${confidencePercent}%`;
            document.getElementById('confidenceFill').style.width = confidencePercent + '%';
            document.getElementById('confidenceFill').textContent = confidencePercent + '%';

            const topDiv = document.getElementById('topPredictions');
            topDiv.innerHTML = '<strong>Top 3 Predictions:</strong>';

            top3.forEach((pred, index) => {
                const item = document.createElement('div');
                item.className = 'top-pred-item';
                item.innerHTML = `
                    <span>${index + 1}. ${pred.class}</span>
                    <span>${(pred.confidence * 100).toFixed(1)}%</span>
                `;
                topDiv.appendChild(item);
            });
        }

        function toggleAuto() {
            autoMode = !autoMode;
            const btn = document.getElementById('autoBtn');

            if (autoMode) {
                btn.textContent = 'Auto Mode: ON';
                btn.classList.remove('btn-secondary');
                btn.classList.add('btn-primary');
                document.getElementById('captureBtn').disabled = true;

                autoInterval = setInterval(captureAndPredict, 2000);
                updateStatus('Auto mode enabled! Predicting every 2 seconds', 'info');
            } else {
                btn.textContent = 'Auto Mode: OFF';
                btn.classList.remove('btn-primary');
                btn.classList.add('btn-secondary');
                document.getElementById('captureBtn').disabled = false;

                if (autoInterval) {
                    clearInterval(autoInterval);
                }
                updateStatus('Auto mode disabled', 'info');
            }
        }

        function toggleSentenceMode() {
            sentenceMode = !sentenceMode;
            const btn = document.getElementById('sentenceBtn');
            const section = document.getElementById('sentenceSection');

            if (sentenceMode) {
                btn.textContent = 'Sentence Mode: ON';
                btn.classList.remove('btn-success');
                btn.classList.add('btn-primary');
                section.style.display = 'block';
                updateStatus('Sentence mode enabled! Signs will be buffered into words', 'info');
            } else {
                btn.textContent = 'Sentence Mode: OFF';
                btn.classList.remove('btn-primary');
                btn.classList.add('btn-success');
                section.style.display = 'none';
                clearSentence();
                updateStatus('Sentence mode disabled', 'info');
            }
        }

        async function clearSentence() {
            try {
                await fetch(`${API_URL}/clear_sentence/${sessionId}`, { method: 'POST' });
                document.getElementById('sentenceText').textContent = '';
                updateStatus('Sentence cleared', 'info');
            } catch (error) {
                console.error('Error clearing sentence:', error);
            }
        }

        function speakSentence() {
            const text = document.getElementById('sentenceText').textContent;
            if (text) {
                const utterance = new SpeechSynthesisUtterance(text);
                window.speechSynthesis.speak(utterance);
            } else {
                updateStatus('No sentence to speak', 'error');
            }
        }

        function updateStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
        }

        window.onload = init;
    </script>
</body>
</html>
