<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignBridge - Learning Mode</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1400px;
            width: 100%;
            padding: 40px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .mode-toggle {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            justify-content: center;
        }

        .mode-btn {
            padding: 15px 30px;
            font-size: 1.1em;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .mode-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .mode-btn.active {
            background: #667eea;
            color: white;
        }

        .alphabet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .alphabet-letter {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .alphabet-letter:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.5);
        }

        .lesson-section {
            margin-top: 30px;
        }

        .section-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 30px;
        }

        .video-section, .result-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
        }

        #webcam {
            width: 100%;
            border-radius: 10px;
            background: #000;
            min-height: 300px;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .video-container {
            position: relative;
        }

        #canvas {
            display: none;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .lesson-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin: 15px 0;
        }

        .lesson-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .lesson-card ul {
            margin-left: 20px;
            line-height: 1.8;
        }

        .lesson-card p {
            line-height: 1.6;
            color: #555;
        }

        .practice-feedback {
            padding: 20px;
            border-radius: 10px;
            margin: 15px 0;
            font-size: 1.1em;
            text-align: center;
        }

        .feedback-correct {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .feedback-incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .feedback-correct h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .feedback-incorrect h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .status {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-weight: 500;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .back-button {
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 SignBridge Learning Mode</h1>
            <p class="subtitle">Learn ASL Finger Spelling with Interactive Practice</p>
        </header>

        <!-- Mode Toggle -->
        <div class="mode-toggle">
            <a href="index.html" class="mode-btn">
                🎯 Prediction Mode
            </a>
            <a href="learning.html" class="mode-btn active">
                📚 Learning Mode
            </a>
        </div>

        <div id="status" class="status info">
            Initializing...
        </div>

        <!-- Letter Selection (shown by default) -->
        <div id="letterSelection" class="lesson-section">
            <h2 class="section-title">Choose a Letter to Learn</h2>
            <div class="alphabet-grid" id="alphabetGrid"></div>
        </div>

        <!-- Lesson Display (hidden by default) -->
        <div id="lessonContent" style="display:none;">
            <div class="back-button">
                <button class="btn-secondary" onclick="backToSelection()">← Back to Letter Selection</button>
            </div>

            <div class="main-content">
                <!-- Practice Section -->
                <div class="video-section">
                    <h2 class="section-title">📹 Practice "<span id="currentLetter"></span>"</h2>
                    <div class="video-container">
                        <video id="webcam" autoplay playsinline></video>
                        <canvas id="overlay"></canvas>
                    </div>
                    <canvas id="canvas"></canvas>
                    <div class="controls">
                        <button class="btn-primary" id="startBtn" onclick="startCamera()">Start Camera</button>
                        <button class="btn-success" id="checkBtn" onclick="checkPractice()" disabled>Check My Sign</button>
                    </div>
                </div>

                <!-- Lesson Info Section -->
                <div class="result-section">
                    <h2 class="section-title">📖 How to Sign "<span id="currentLetter2"></span>"</h2>
                    <div class="lesson-card">
                        <h3>Description</h3>
                        <p id="description"></p>

                        <h3 style="margin-top: 20px;">Tips</h3>
                        <ul id="tips"></ul>

                        <h3 style="margin-top: 20px;">Common Mistakes</h3>
                        <ul id="mistakes"></ul>
                    </div>

                    <div id="feedbackArea"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        let currentLetter = null;
        let stream = null;

        // Initialize
        async function init() {
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();

                if (data.model_loaded) {
                    updateStatus('API connected! Choose a letter to start learning.', 'success');
                    loadAlphabet();
                } else {
                    updateStatus('API connected but model not loaded. Please train the model first.', 'error');
                }
            } catch (error) {
                updateStatus('Cannot connect to API. Make sure backend is running on port 8000.', 'error');
            }
        }

        // Load alphabet letters
        async function loadAlphabet() {
            try {
                const response = await fetch(`${API_URL}/classes`);
                const data = await response.json();

                const grid = document.getElementById('alphabetGrid');
                grid.innerHTML = '';

                data.classes.forEach(letter => {
                    const div = document.createElement('div');
                    div.className = 'alphabet-letter';
                    div.textContent = letter;
                    div.onclick = () => loadLesson(letter);
                    grid.appendChild(div);
                });
            } catch (error) {
                console.error('Error loading alphabet:', error);
                updateStatus('Error loading alphabet', 'error');
            }
        }

        // Load lesson for a specific letter
        async function loadLesson(letter) {
            currentLetter = letter;
            document.getElementById('currentLetter').textContent = letter;
            document.getElementById('currentLetter2').textContent = letter;

            try {
                const response = await fetch(`${API_URL}/learn/${letter}`);
                const lesson = await response.json();

                document.getElementById('description').textContent = lesson.description;

                const tipsList = document.getElementById('tips');
                tipsList.innerHTML = '';
                lesson.tips.forEach(tip => {
                    const li = document.createElement('li');
                    li.textContent = tip;
                    tipsList.appendChild(li);
                });

                const mistakesList = document.getElementById('mistakes');
                mistakesList.innerHTML = '';
                lesson.common_mistakes.forEach(mistake => {
                    const li = document.createElement('li');
                    li.textContent = mistake;
                    mistakesList.appendChild(li);
                });

                document.getElementById('letterSelection').style.display = 'none';
                document.getElementById('lessonContent').style.display = 'block';
                document.getElementById('feedbackArea').innerHTML = '';

                updateStatus(`Learning "${letter}". Read the instructions and click "Start Camera" to practice.`, 'info');
            } catch (error) {
                console.error('Error loading lesson:', error);
                updateStatus('Error loading lesson', 'error');
            }
        }

        // Back to letter selection
        function backToSelection() {
            document.getElementById('letterSelection').style.display = 'block';
            document.getElementById('lessonContent').style.display = 'none';
            currentLetter = null;

            // Stop camera if running
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }

            document.getElementById('startBtn').disabled = false;
            document.getElementById('checkBtn').disabled = true;
            document.getElementById('feedbackArea').innerHTML = '';

            updateStatus('Choose a letter to learn', 'info');
        }

        // Start webcam
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480 }
                });

                const video = document.getElementById('webcam');
                const overlay = document.getElementById('overlay');

                video.srcObject = stream;

                // Match overlay canvas size with video
                video.onloadedmetadata = () => {
                    overlay.width = video.videoWidth;
                    overlay.height = video.videoHeight;
                };

                document.getElementById('startBtn').disabled = true;
                document.getElementById('checkBtn').disabled = false;

                updateStatus(`Camera started! Show the "${currentLetter}" sign and click "Check My Sign"`, 'success');
            } catch (error) {
                updateStatus('Error accessing camera: ' + error.message, 'error');
            }
        }

        // Check practice
        async function checkPractice() {
            const video = document.getElementById('webcam');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            ctx.drawImage(video, 0, 0);

            updateStatus('Checking your sign...', 'info');

            canvas.toBlob(async (blob) => {
                try {
                    const formData = new FormData();
                    formData.append('file', blob, 'practice.jpg');

                    const response = await fetch(`${API_URL}/practice/${currentLetter}`, {
                        method: 'POST',
                        body: formData
                    });

                    if (response.ok) {
                        const feedback = await response.json();
                        displayFeedback(feedback);
                        updateStatus('Feedback ready!', 'success');
                    } else {
                        const error = await response.json();
                        updateStatus('Error: ' + error.detail, 'error');
                    }
                } catch (error) {
                    updateStatus('Error: ' + error.message, 'error');
                }
            }, 'image/jpeg');
        }

        // Display feedback
        function displayFeedback(feedback) {
            const feedbackArea = document.getElementById('feedbackArea');
            const className = feedback.correct ? 'feedback-correct' : 'feedback-incorrect';
            const emoji = feedback.correct ? '✅' : '❌';

            let top3HTML = '<div style="margin-top: 15px;"><strong>What the model saw:</strong><ul style="list-style: none; padding: 0; margin-top: 10px;">';
            feedback.top_3.forEach((pred, idx) => {
                top3HTML += `<li style="padding: 5px 0;">${idx + 1}. ${pred.class} - ${(pred.confidence * 100).toFixed(1)}%</li>`;
            });
            top3HTML += '</ul></div>';

            feedbackArea.innerHTML = `
                <div class="practice-feedback ${className}">
                    <h3>${emoji} ${feedback.feedback_message}</h3>
                    <p style="font-size: 1.1em; margin: 10px 0;">
                        <strong>You showed:</strong> ${feedback.your_sign}
                        <strong>(${(feedback.confidence * 100).toFixed(1)}% confident)</strong>
                    </p>
                    <p style="font-size: 1.1em;">
                        <strong>Target:</strong> ${feedback.target}
                    </p>
                    ${top3HTML}
                </div>
            `;
        }

        // Update status
        function updateStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
        }

        // Initialize on load
        window.onload = init;
    </script>
</body>
</html>
